name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: |
          unzip -q quest-rewards-build.zip -d src
          if [ -f google-services.json ]; then cp google-services.json src/app/google-services.json; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build debug APK
        working-directory: src
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: quest-rewards-debug-apk
          path: src/app/build/outputs/apk/debug/*.apk
